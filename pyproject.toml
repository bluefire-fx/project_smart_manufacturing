[project]
name = "project-smart-manufacturing"
version = "0.1.0"
description = "HS Aalen Predictive Analytics Project"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "joblib>=1.5.3",
    "jupyter>=1.1.1",
    "jupytext>=1.19.3",
    "matplotlib>=3.10.9",
    "numpy>=2.4.5",
    "pandas>=3.0.3",
    "pandas-stubs>=3.0.0.260204",
    "scikit-learn>=1.8.0",
    "scikit-learn-stubs>=0.0.3",
    "seaborn>=0.13.2",
    "streamlit>=1.57.0",
]

[tool.jupytext]
formats = "ipynb,py:percent"
notebook_metadata_filter = "-all"
